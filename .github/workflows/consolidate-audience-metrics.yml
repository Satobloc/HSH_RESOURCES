name: Consolidate audience metrics
on:
  push:
    branches: [main]
    paths:
      - 'EXPOSURE_STATS/AUDIENCE_METRICS/*.csv'
      - 'tools/build_audience_metrics.py'
      - '.github/workflows/consolidate-audience-metrics.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audience-metrics-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate consolidated dataset
        run: |
          python tools/build_audience_metrics.py
          python -m json.tool EXPOSURE_STATS/AUDIENCE_METRICS/audience_metrics_complete.json >/dev/null
      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EXPOSURE_STATS/AUDIENCE_METRICS/audience_metrics_complete.json
          if git diff --cached --quiet; then
            echo "Consolidation already current"
            exit 0
          fi
          git commit -m "Generate consolidated audience metrics"
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
