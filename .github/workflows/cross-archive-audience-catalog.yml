name: Discover cross-archive audience metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/build_cross_archive_audience_catalog.py'
      - '.github/workflows/cross-archive-audience-catalog.yml'
permissions:
  contents: write
concurrency:
  group: cross-archive-audience-catalog
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build cross-archive catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_cross_archive_audience_catalog.py
      - name: Validate and publish
        run: |
          python -m json.tool EXPOSURE_STATS/AUDIENCE_METRICS/cross_archive_audience_catalog.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EXPOSURE_STATS/AUDIENCE_METRICS/cross_archive_audience_catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh cross-archive audience catalogue'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
