name: Maintain bibliography coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "indexes/index-state.json"
      - "indexes/HUMAN_BIBLIOGRAPHY.md"
      - "tools/update_bibliography_coverage.py"

permissions:
  contents: write

concurrency:
  group: bibliography-coverage-main
  cancel-in-progress: false

jobs:
  coverage:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip bibliography-coverage]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bibliography coverage report
        run: python tools/update_bibliography_coverage.py --root . --apply

      - name: Validate source structural state
        run: |
          python -m json.tool indexes/index-state.json >/dev/null
          test -f indexes/HUMAN_BIBLIOGRAPHY.md
          test -f indexes/BIBLIOGRAPHY_COVERAGE.md

      - name: Commit coverage report
        run: |
          git config user.name "HSH Resources Bibliography Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indexes/BIBLIOGRAPHY_COVERAGE.md
          if git diff --cached --quiet; then
            echo "Bibliography coverage already current"
            exit 0
          fi
          git commit -m "[skip bibliography-coverage] Refresh bibliography coverage"
          git pull --rebase origin main
          git push origin HEAD:main
