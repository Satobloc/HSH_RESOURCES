name: Maintain bibliography coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "derived/manifests/extraction.jsonl"
      - "indexes/index-state.json"
      - "indexes/HUMAN_BIBLIOGRAPHY.md"
      - "indexes/BIBLIOGRAPHY_EXCLUSIONS.md"
      - "indexes/bibliography_batches/**/*.md"
      - "tools/finalize_bibliography.py"
      - "tools/update_bibliography_coverage.py"
      - "tools/build_bibliography_intake.py"
      - ".github/workflows/bibliography-coverage.yml"

permissions:
  contents: write

concurrency:
  group: bibliography-coverage-main
  cancel-in-progress: false

jobs:
  coverage:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip bibliography-coverage]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build provisional bibliography batches and straggler queue
        run: python tools/finalize_bibliography.py --root . --batch-size 50

      - name: Build bibliography coverage report
        run: python tools/update_bibliography_coverage.py --root . --apply

      - name: Refresh human-review intake queue
        run: python tools/build_bibliography_intake.py --root . --max-items 250

      - name: Validate bibliography state
        run: |
          python -m json.tool indexes/index-state.json >/dev/null
          test -f indexes/HUMAN_BIBLIOGRAPHY.md
          test -f indexes/BIBLIOGRAPHY_EXCLUSIONS.md
          test -f indexes/BIBLIOGRAPHY_COVERAGE.md
          test -f indexes/BIBLIOGRAPHY_INTAKE.md
          test -f indexes/BIBLIOGRAPHY_STRAGGLERS.md
          test -f indexes/bibliography_provisional/README.md

      - name: Commit generated bibliography state
        run: |
          git config user.name "HSH Resources Bibliography Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indexes/BIBLIOGRAPHY_COVERAGE.md indexes/BIBLIOGRAPHY_INTAKE.md indexes/BIBLIOGRAPHY_STRAGGLERS.md indexes/bibliography_provisional/
          if git diff --cached --quiet; then
            echo "Bibliography state already current"
            exit 0
          fi
          git commit -m "[skip bibliography-coverage] Finalize provisional bibliography batches"
          if ! git push origin HEAD:main; then
            echo "Main advanced during bibliography maintenance; refusing to rebase generated state over newer source/review changes."
            exit 1
          fi
