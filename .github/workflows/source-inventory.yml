name: Build three-repo source inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'SOURCE_INVENTORY/SABLE/source_inventory_run/**'

permissions:
  contents: write

concurrency:
  group: three-repo-source-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout private resources repository
        uses: actions/checkout@v4
        with:
          path: RESOURCES
          fetch-depth: 0

      - name: Checkout HsH
        uses: actions/checkout@v4
        with:
          repository: Satobloc/HsH
          ref: main
          path: HsH
          fetch-depth: 1

      - name: Checkout GLASS
        uses: actions/checkout@v4
        with:
          repository: Satobloc/SAT_THEORY_ARCHIVE_2023-25
          ref: main
          path: GLASS
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record exact source revisions
        shell: bash
        run: |
          echo "RESOURCES_SHA=$(git -C RESOURCES rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "HSH_SHA=$(git -C HsH rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "GLASS_SHA=$(git -C GLASS rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run quarantine-respecting inventory sampler
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/source_inventory_run"
          RESOURCES_GIT="$RUNNER_TEMP/resources.git"

          # Do not let prior generated inventory feed back into the next inventory.
          rm -rf RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run
          rm -rf "$OUT"

          # The sampler inventories repository content, not local checkout metadata.
          # Preserve the private repo's .git directory outside the scanned tree so it
          # can be restored for the publish step. Public checkout metadata is disposable.
          mv RESOURCES/.git "$RESOURCES_GIT"
          trap 'if [ -d "$RESOURCES_GIT" ]; then mv "$RESOURCES_GIT" RESOURCES/.git; fi' EXIT
          rm -rf HsH/.git GLASS/.git

          python HsH/WORKSPACES/SABLE/scripts/source_inventory_sampler.py \
            --repo HSH=HsH \
            --repo GLASS=GLASS \
            --repo RESOURCES=RESOURCES \
            --out-dir "$OUT"

          mv "$RESOURCES_GIT" RESOURCES/.git
          trap - EXIT

          # Add immutable snapshot provenance and emit the standard cross-repo run manifest.
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'source_inventory_run'
          summary_path = out / 'summary.json'
          data = json.loads(summary_path.read_text(encoding='utf-8'))
          source_commits = {
              'HSH': os.environ['HSH_SHA'],
              'GLASS': os.environ['GLASS_SHA'],
              'RESOURCES': os.environ['RESOURCES_SHA'],
          }
          data['source_commits'] = source_commits
          data['execution_surface'] = 'GitHub Actions / Satobloc/HSH_RESOURCES'
          summary_path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          run_id = f"github-actions:{os.environ.get('GITHUB_RUN_ID', 'unknown')}:{os.environ.get('GITHUB_RUN_ATTEMPT', '1')}"
          pruned = data.get('prior_art_pruned_by_repository', {})
          remote_root = 'SOURCE_INVENTORY/SABLE/source_inventory_run'
          manifest = {
              'schema_version': 1,
              'run_id': run_id,
              'tool': {
                  'name': 'source_inventory_sampler.py',
                  'version_or_commit': f"{data.get('tool', 'unknown')} @ HsH {os.environ['HSH_SHA']}",
              },
              'started_at': os.environ['RUN_STARTED_AT'],
              'finished_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'inputs': [
                  {
                      'repository': 'Satobloc/HsH',
                      'commit_sha': source_commits['HSH'],
                      'read_roots': ['/'],
                      'quarantine_roots_pruned': int(pruned.get('HSH', 0)),
                  },
                  {
                      'repository': 'Satobloc/SAT_THEORY_ARCHIVE_2023-25',
                      'commit_sha': source_commits['GLASS'],
                      'read_roots': ['/'],
                      'quarantine_roots_pruned': int(pruned.get('GLASS', 0)),
                  },
                  {
                      'repository': 'Satobloc/HSH_RESOURCES',
                      'commit_sha': source_commits['RESOURCES'],
                      'read_roots': ['/'],
                      'quarantine_roots_pruned': int(pruned.get('RESOURCES', 0)),
                  },
              ],
              'write_scope': {
                  'repositories': ['Satobloc/HSH_RESOURCES'],
                  'paths': [remote_root + '/'],
              },
              'mode': 'replace-generated',
              'seed': data.get('seed'),
              'outputs': [
                  {'path': remote_root + '/inventory.csv', 'sha256': sha256(out / 'inventory.csv'), 'source_identity': data.get('inventory_sha256')},
                  {'path': remote_root + '/sample.csv', 'sha256': sha256(out / 'sample.csv'), 'source_identity': data.get('inventory_sha256')},
                  {'path': remote_root + '/summary.json', 'sha256': sha256(summary_path), 'source_identity': data.get('inventory_sha256')},
              ],
              'status': 'success',
              'github_actions': {
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'workflow': os.environ.get('GITHUB_WORKFLOW'),
              },
              'notes': 'Published commit is represented by repository history; the manifest records exact input snapshots and output hashes without creating a self-referential commit hash.',
          }
          (out / 'run_manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          mkdir -p RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run
          cp "$OUT/inventory.csv" RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run/inventory.csv
          cp "$OUT/sample.csv" RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run/sample.csv
          cp "$OUT/summary.json" RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run/summary.json
          cp "$OUT/run_manifest.json" RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run/run_manifest.json

      - name: Validate outputs and quarantine behavior
        shell: bash
        run: |
          set -euo pipefail
          test -s RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run/inventory.csv
          test -s RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run/sample.csv
          test -s RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run/run_manifest.json
          python -m json.tool RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run/summary.json >/dev/null
          python -m json.tool RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run/run_manifest.json >/dev/null

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('RESOURCES/SOURCE_INVENTORY/SABLE/source_inventory_run')
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'run_manifest.json').read_text(encoding='utf-8'))
          assert summary['file_count'] > 0
          assert set(summary['source_commits']) == {'HSH', 'GLASS', 'RESOURCES'}

          assert manifest['run_id']
          assert manifest['mode'] == 'replace-generated'
          assert manifest['status'] == 'success'
          assert len(manifest['inputs']) == 3
          assert manifest['write_scope']['repositories'] == ['Satobloc/HSH_RESOURCES']
          assert all(item['commit_sha'] for item in manifest['inputs'])
          assert len(manifest['outputs']) == 3
          assert all(item['sha256'] for item in manifest['outputs'])

          with (root / 'inventory.csv').open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          assert rows, 'inventory is empty'
          leaked = [r['path'] for r in rows if 'PRIOR_ART' in Path(r['path']).parts]
          assert not leaked, f'PRIOR_ART path leaked into inventory: {leaked[:5]}'
          print(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Commit refreshed private inventory
        shell: bash
        run: |
          set -euo pipefail
          cd RESOURCES
          git config user.name 'H(s)H Source Inventory Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          OUT="$RUNNER_TEMP/source_inventory_run"
          TARGET='SOURCE_INVENTORY/SABLE/source_inventory_run'

          # Generated snapshots are never rebased. If main advances while this run is
          # publishing, discard the stale local commit, reset to the newest main, lay
          # the already-validated snapshot back down, and retry the scoped commit.
          # The manifest records the exact source SHAs sampled, so this remains honest;
          # any newer non-generated push queues a later inventory run via the trigger.
          for attempt in 1 2 3 4; do
            echo "Publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main

            rm -rf "$TARGET"
            mkdir -p "$TARGET"
            cp "$OUT/inventory.csv" "$TARGET/inventory.csv"
            cp "$OUT/sample.csv" "$TARGET/sample.csv"
            cp "$OUT/summary.json" "$TARGET/summary.json"
            cp "$OUT/run_manifest.json" "$TARGET/run_manifest.json"

            git add "$TARGET"
            if git diff --cached --quiet; then
              echo 'Source inventory already current for this sampled snapshot.'
              exit 0
            fi

            git commit -m '[skip source-inventory] Refresh three-repo source inventory'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race on attempt ${attempt}; discarding generated commit and retrying from latest main." >&2
            sleep $((attempt * 2))
          done

          echo 'Unable to publish inventory after four rebuild-from-main retries.' >&2
          exit 1
